name: Index

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run index
        env:
          ARCHIVE_ORG_BASE_URL: ${{ vars.ARCHIVE_ORG_BASE_URL }}
          MAX_CONCURRENT_REQUESTS: ${{ vars.MAX_CONCURRENT_REQUESTS }}
          REQUEST_DELAY_MS: ${{ vars.REQUEST_DELAY_MS }}
          INDEXER_MAX_RETRIES: ${{ vars.INDEXER_MAX_RETRIES }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexed-data
          path: data/
          retention-days: 7
      - id: diff
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update ROM catalog data"
          git push
